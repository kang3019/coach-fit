# CoachFit Nginx 리버스 프록시 설정
#
# 설치 위치: /etc/nginx/sites-available/coachfit  (sites-enabled 에 심볼릭 링크)
# 사용 전 server_name 의 api.example.com 을 실제 도메인으로 바꾸세요.
# HTTPS 는 certbot --nginx 가 이 파일에 443 블록과 인증서 경로를 자동으로 추가합니다.
# 자세한 절차: docs/deployment.md

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 코칭(Bedrock) 응답이 느릴 수 있어 읽기 타임아웃을 넉넉히 둡니다.
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
}
