name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "python-ai-backend/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend to EC2
    if: ${{ vars.ENABLE_EC2_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and verify backend on EC2 via OpenSSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 "${EC2_USER}@${EC2_HOST}" << 'EOF'
            set -e
            cd /home/ubuntu/coach-fit/python-ai-backend
            bash scripts/deploy.sh
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8000/health -o /dev/null; then
                echo "Backend is healthy"
                exit 0
              fi
              sleep 3
            done
            echo "Backend health check failed"
            exit 1
          EOF
          rm -f ~/.ssh/id_rsa
