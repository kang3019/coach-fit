<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CoachFit — AI 코치가 함께하는 피트니스 트래커">
  <meta name="theme-color" content="#0E1116">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CoachFit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CoachFit</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 플러터 웹 초기 로딩 중 한글 폰트/CanvasKit 다운로드 지연으로
       두부 글리프(□□)가 깜빡이는 걸 가리는 다크 스플래시 화면.
       Flutter 가 첫 프레임을 그리면 자동으로 fade-out 후 제거됨. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0E1116;
      overflow: hidden;
    }

    #coachfit-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0E1116;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #coachfit-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(0, 229, 160, 0.3), rgba(0, 229, 160, 0.1));
      border: 2px solid #00E5A0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      box-shadow: 0 0 40px rgba(0, 229, 160, 0.4);
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    .splash-title {
      margin-top: 20px;
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .splash-subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .splash-spinner {
      margin-top: 32px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 229, 160, 0.15);
      border-top-color: #00E5A0;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }

    @keyframes splash-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 40px rgba(0, 229, 160, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 60px rgba(0, 229, 160, 0.6);
      }
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 로딩 스플래시 — 플러터 첫 프레임 렌더 시 자바스크립트가 제거 -->
  <div id="coachfit-splash">
    <div class="splash-logo">💪</div>
    <div class="splash-title">CoachFit</div>
    <div class="splash-subtitle">AI Fitness Coach</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // 플러터 첫 프레임이 그려진 뒤에도 CanvasKit 가 한국어 폰트 로딩을 끝내기 전까지는
    // 모든 한글이 두부 글리프(□□)로 보임. 스플래시를 안전하게 유지하려면:
    //   1) flutter-first-frame 이벤트 대기 (Flutter 렌더 준비)
    //   2) document.fonts.ready 대기 (브라우저 폰트 로딩)
    //   3) 최소 추가 지연 900ms (CanvasKit 비동기 폰트 fetch 여유)
    // 셋 다 만족되면 fade-out.
    (function () {
      var firstFrameDone = false;
      var fontsDone = false;
      var splashRemoved = false;

      function tryRemove() {
        if (splashRemoved) return;
        if (!firstFrameDone || !fontsDone) return;
        splashRemoved = true;
        var splash = document.getElementById('coachfit-splash');
        if (!splash) return;
        splash.classList.add('fade-out');
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }

      window.addEventListener('flutter-first-frame', function () {
        // 첫 프레임 후 추가 900ms 대기 — CanvasKit 폰트 비동기 다운로드가
        // 거의 완료되는 체감 안전 구간.
        setTimeout(function () {
          firstFrameDone = true;
          tryRemove();
        }, 900);
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          fontsDone = true;
          tryRemove();
        });
      } else {
        fontsDone = true;
      }

      // 최후 보루: 8초 지나도 이벤트 안 오면 강제로 제거 (앱이 깨진 상태를 방지).
      setTimeout(function () {
        firstFrameDone = true;
        fontsDone = true;
        tryRemove();
      }, 8000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
